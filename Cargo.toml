[package]
name = "yield-curves"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Pure-Rust yield curve interpolation (Nelson-Siegel, Svensson, PCHIP) and bond pricing. Zero deps."
repository = "https://github.com/mqmalagris/yield-curves"
homepage = "https://github.com/mqmalagris/yield-curves"
documentation = "https://docs.rs/yield-curves"
readme = "README.md"
keywords = ["finance", "yield-curve", "nelson-siegel", "svensson", "bond"]
categories = ["finance", "science", "mathematics"]
exclude = [
    ".github/",
    ".leankg/",
    "leankg.yaml",
    "docs/LAUNCH-KIT.md",
    "docs/ROADMAP.md",
    "scripts/",
]

[lints.rust]
unsafe_code = "forbid"

